models:
  - name: dim_date
    description: One row per local date, with calendar attributes and NL public holidays.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: is_public_holiday
        data_tests: [not_null]
      - name: is_non_working_day
        description: Weekend or official public holiday.

  - name: fct_hourly_energy_market
    description: >
      One row per hour: all-in electricity and gas prices (EnergyZero), grid carbon intensity,
      renewable share and generation mix (Electricity Maps), and weather (Open-Meteo).
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
      - name: date_local
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_greenhouse_hourly_energy
    description: >
      Synthetic greenhouse energy use, cost (EUR, all-in prices) and CO2 per hour, for the
      baseline and price-optimized lighting scenarios. Grain: hour_utc x scenario.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hour_utc, scenario]
    columns:
      - name: scenario
        data_tests:
          - accepted_values:
              arguments:
                values: [baseline, optimized]
      - name: date_local
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: total_energy_cost_eur
        description: Null when the electricity or gas price for the hour is missing.

  - name: fct_greenhouse_daily_energy
    description: >
      Daily greenhouse energy, cost and CO2 with baseline and optimized side by side, plus
      savings. Rows with is_complete = false had at least one hour without a price.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "baseline_lighting_hours = optimized_lighting_hours"
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: cost_savings_eur
        description: Baseline minus optimized total cost. Positive = optimization saves money.
